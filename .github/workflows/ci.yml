name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tg_store_test
      TELEGRAM_BOT_TOKEN: "123456:ABCDEF_test_ci_token"
      ENVIRONMENT: development
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tg_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest tests/ -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test test/auth_bloc_test.dart

  frontend-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Пока в проекте много info (deprecated_member_use и т.д.) — не валим CI на info/warning
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
